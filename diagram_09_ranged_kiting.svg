<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Malgun Gothic, Arial, sans-serif">
  <rect width="900" height="500" fill="#F5F6FA"/>

  <!-- Title -->
  <text x="40" y="40" font-size="18" font-weight="700" fill="#1A1D29">Kiting AI · Range Behavior</text>
  <text x="40" y="62" font-size="13" fill="#6B7280">Monster3 · 원거리 (Beez Honey) — 거리 유지 + 투사체</text>

  <defs>
    <marker id="arrow9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1D29"/>
    </marker>
    <marker id="arrow9-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E63946"/>
    </marker>
    <marker id="arrow9-flee" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0891B2"/>
    </marker>
  </defs>

  <!-- Range circles (centered on Monster) -->
  <g transform="translate(650, 270)">
    <!-- attackRange (outer) -->
    <circle cx="0" cy="0" r="280" fill="#1E2761" fill-opacity="0.05" stroke="#1E2761" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="0" y="-260" font-size="11" font-weight="600" fill="#1E2761" text-anchor="middle">rangedAttackRange</text>

    <!-- kiteDistance (inner) -->
    <circle cx="0" cy="0" r="140" fill="#E63946" fill-opacity="0.10" stroke="#E63946" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="0" y="-120" font-size="11" font-weight="600" fill="#E63946" text-anchor="middle">kiteDistance</text>
  </g>

  <!-- Monster -->
  <g transform="translate(650, 270)">
    <circle cx="0" cy="0" r="28" fill="#1E2761"/>
    <text x="0" y="6" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">M</text>
    <text x="0" y="46" font-size="11" font-weight="600" fill="#1E2761" text-anchor="middle">Monster3</text>
  </g>

  <!-- Player (mid range — optimal) -->
  <g transform="translate(450, 270)">
    <circle cx="0" cy="0" r="22" fill="#E63946"/>
    <text x="0" y="5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">P</text>
    <text x="0" y="42" font-size="10" font-weight="600" fill="#E63946" text-anchor="middle">Player</text>
  </g>

  <!-- Projectile trail (mid range fire) -->
  <line x1="625" y1="270" x2="475" y2="270" stroke="#1A1D29" stroke-width="2" marker-end="url(#arrow9)"/>
  <text x="550" y="262" font-size="11" font-weight="600" fill="#1A1D29" text-anchor="middle">Projectile</text>
  <text x="550" y="288" font-size="10" fill="#6B7280" text-anchor="middle">muzzleLocalOffset → forward</text>

  <!-- Flee arrow (when too close) -->
  <g opacity="0.7">
    <path d="M 630 360 L 720 360" stroke="#0891B2" stroke-width="2.5" fill="none" marker-end="url(#arrow9-flee)" stroke-dasharray="5 3"/>
    <text x="675" y="380" font-size="10" font-weight="600" fill="#0891B2" text-anchor="middle">너무 가까우면 후퇴</text>
  </g>

  <!-- Left side: behavior states -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="280" height="350" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="8"/>
    <text x="20" y="30" font-size="14" font-weight="700" fill="#1A1D29">행동 분기 (거리 기반)</text>

    <!-- Case 1: too close -->
    <rect x="20" y="50" width="240" height="80" fill="#FCE9EB" rx="6"/>
    <text x="32" y="74" font-size="12" font-weight="700" fill="#E63946">거리 &lt; kiteDistance</text>
    <text x="32" y="94" font-size="11" fill="#1A1D29">→ 후퇴 (Retreat)</text>
    <text x="32" y="112" font-size="11" fill="#6B7280">반대 방향으로 이동</text>

    <!-- Case 2: optimal -->
    <rect x="20" y="140" width="240" height="80" fill="#E7F3F5" rx="6"/>
    <text x="32" y="164" font-size="12" font-weight="700" fill="#0891B2">kite &lt; 거리 &lt; attackRange</text>
    <text x="32" y="184" font-size="11" fill="#1A1D29">→ 정지 + 투사체 발사</text>
    <text x="32" y="202" font-size="11" fill="#6B7280">애님 이벤트로 OnRangedAttackFire</text>

    <!-- Case 3: too far -->
    <rect x="20" y="230" width="240" height="80" fill="#EEF0F8" rx="6"/>
    <text x="32" y="254" font-size="12" font-weight="700" fill="#1E2761">거리 &gt; attackRange</text>
    <text x="32" y="274" font-size="11" fill="#1A1D29">→ 추격 (Chase)</text>
    <text x="32" y="292" font-size="11" fill="#6B7280">사거리 내로 진입까지 이동</text>
  </g>

  <!-- Bottom info -->
  <g transform="translate(40, 480)">
    <text x="0" y="0" font-size="11" fill="#6B7280">투사체 — MonsterProjectile.cs · OnTriggerEnter(other) → IDamageable.TakeDamage  ·  parent guard로 자기 콜라이더 무시</text>
  </g>
</svg>
