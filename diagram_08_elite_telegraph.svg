<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Malgun Gothic, Arial, sans-serif">
  <rect width="900" height="500" fill="#F5F6FA"/>

  <!-- Title -->
  <text x="40" y="40" font-size="18" font-weight="700" fill="#1A1D29">Telegraph Attack · Timeline</text>
  <text x="40" y="62" font-size="13" fill="#6B7280">Monster2 · 엘리트 (Devil Tree Wither)</text>

  <defs>
    <marker id="arrow8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1E2761"/>
    </marker>
  </defs>

  <!-- Timeline base line -->
  <line x1="60" y1="240" x2="860" y2="240" stroke="#1A1D29" stroke-width="2"/>

  <!-- Phase blocks -->
  <!-- Chase -->
  <rect x="60" y="195" width="120" height="90" fill="#1E2761" rx="6"/>
  <text x="120" y="232" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Chase</text>
  <text x="120" y="252" font-size="11" fill="#CADCFC" text-anchor="middle">추격</text>

  <!-- Telegraph 2s -->
  <rect x="190" y="170" width="200" height="140" fill="#E63946" rx="6"/>
  <text x="290" y="222" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Telegraph</text>
  <text x="290" y="245" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">2.0s</text>
  <text x="290" y="270" font-size="11" fill="#FFFFFF" text-anchor="middle">예고 모션</text>
  <text x="290" y="290" font-size="11" fill="#FFE5E7" text-anchor="middle">(회피 가능 윈도우)</text>

  <!-- Heavy Attack -->
  <rect x="400" y="195" width="150" height="90" fill="#1A1D29" rx="6"/>
  <text x="475" y="226" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Heavy</text>
  <text x="475" y="245" font-size="11" fill="#CADCFC" text-anchor="middle">강공격 (광역)</text>
  <text x="475" y="265" font-size="10" fill="#E63946" text-anchor="middle">anim event hit</text>

  <!-- Recovery -->
  <rect x="560" y="195" width="180" height="90" fill="#6B7280" rx="6"/>
  <text x="650" y="226" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Recovery</text>
  <text x="650" y="245" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">1.5s</text>
  <text x="650" y="265" font-size="11" fill="#E5E7EB" text-anchor="middle">경직</text>

  <!-- Back to Chase -->
  <rect x="750" y="195" width="110" height="90" fill="#1E2761" rx="6"/>
  <text x="805" y="232" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Chase</text>
  <text x="805" y="252" font-size="11" fill="#CADCFC" text-anchor="middle">반복</text>

  <!-- Arrows between phases -->
  <path d="M 180 240 L 190 240" stroke="#1E2761" stroke-width="2" marker-end="url(#arrow8)"/>
  <path d="M 390 240 L 400 240" stroke="#1E2761" stroke-width="2" marker-end="url(#arrow8)"/>
  <path d="M 550 240 L 560 240" stroke="#1E2761" stroke-width="2" marker-end="url(#arrow8)"/>
  <path d="M 740 240 L 750 240" stroke="#1E2761" stroke-width="2" marker-end="url(#arrow8)"/>

  <!-- Cancel branch -->
  <path d="M 290 170 L 290 110 L 805 110 L 805 195" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow8)"/>
  <text x="540" y="100" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="600">캔슬 (회피 성공 시 — 거리 벌리면 Chase로 복귀)</text>

  <!-- Bottom info -->
  <g transform="translate(40, 360)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#1A1D29">트리거 조건 · 데미지</text>
    <text x="0" y="22" font-size="12" fill="#1A1D29">· attackRange 진입 시 Telegraph 시작</text>
    <text x="0" y="42" font-size="12" fill="#1A1D29">· Heavy 명중 시 heavyAttackPower 데미지 (광역 이펙트 + 사운드)</text>
    <text x="0" y="62" font-size="12" fill="#1A1D29">· 회피 성공 = 플레이어가 attackRange + 1.5 만큼 거리 벌리면 캔슬</text>
    <text x="0" y="82" font-size="12" fill="#1A1D29">· Recovery 중에는 다음 사이클 진입 불가</text>
  </g>

  <!-- Time markers -->
  <g font-size="10" fill="#6B7280">
    <text x="120" y="320" text-anchor="middle">t = 0</text>
    <text x="290" y="320" text-anchor="middle">~2s</text>
    <text x="475" y="320" text-anchor="middle">~2.3s</text>
    <text x="650" y="320" text-anchor="middle">~3.8s</text>
  </g>
</svg>
