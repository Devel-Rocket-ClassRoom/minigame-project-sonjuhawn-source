<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Malgun Gothic, Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="500" fill="#F5F6FA"/>

  <!-- Title -->
  <text x="40" y="40" font-size="18" font-weight="700" fill="#1A1D29">FSM · State Diagram</text>
  <text x="40" y="62" font-size="13" fill="#6B7280">Monster1 · 일반 근접 몬스터</text>

  <!-- Defs: arrow markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1E2761"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E63946"/>
    </marker>
  </defs>

  <!-- States (pill shape) -->
  <!-- Idle -->
  <rect x="60" y="200" width="140" height="60" rx="30" fill="#1E2761"/>
  <text x="130" y="237" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Idle</text>

  <!-- Chase -->
  <rect x="290" y="200" width="140" height="60" rx="30" fill="#1E2761"/>
  <text x="360" y="237" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Chase</text>

  <!-- Attack -->
  <rect x="520" y="200" width="140" height="60" rx="30" fill="#1E2761"/>
  <text x="590" y="237" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Attack</text>

  <!-- Damaged (above) -->
  <rect x="290" y="80" width="140" height="60" rx="30" fill="#E63946"/>
  <text x="360" y="117" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Damaged</text>

  <!-- Dead (right side) -->
  <rect x="710" y="200" width="140" height="60" rx="30" fill="#1A1D29"/>
  <text x="780" y="237" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Dead</text>

  <!-- Transitions -->
  <!-- Idle ↔ Chase -->
  <path d="M 200 220 L 290 220" stroke="#1E2761" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="245" y="212" font-size="11" fill="#1E2761" text-anchor="middle">플레이어 감지</text>

  <path d="M 290 240 L 200 240" stroke="#6B7280" stroke-width="2" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow)"/>
  <text x="245" y="258" font-size="11" fill="#6B7280" text-anchor="middle">감지 해제</text>

  <!-- Chase ↔ Attack -->
  <path d="M 430 220 L 520 220" stroke="#1E2761" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="475" y="212" font-size="11" fill="#1E2761" text-anchor="middle">공격 범위 진입</text>

  <path d="M 520 240 L 430 240" stroke="#6B7280" stroke-width="2" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow)"/>
  <text x="475" y="258" font-size="11" fill="#6B7280" text-anchor="middle">쿨다운 / 이탈</text>

  <!-- Chase → Damaged (피격) -->
  <path d="M 360 200 L 360 140" stroke="#E63946" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <text x="375" y="175" font-size="11" fill="#E63946">피격</text>

  <!-- Damaged → Chase -->
  <path d="M 380 140 Q 420 170 380 200" stroke="#6B7280" stroke-width="2" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow)"/>
  <text x="440" y="175" font-size="11" fill="#6B7280">스태거 종료</text>

  <!-- Attack/Chase → Dead -->
  <path d="M 660 220 L 710 220" stroke="#1A1D29" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="685" y="212" font-size="11" font-weight="600" fill="#1A1D29" text-anchor="middle">HP 0</text>

  <!-- Self loop: Attack (animation event hit) -->
  <path d="M 580 200 Q 580 160 590 160 Q 600 160 600 200" stroke="#1E2761" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="590" y="155" font-size="10" fill="#1E2761" text-anchor="middle">anim event</text>

  <!-- Legend -->
  <g transform="translate(40, 420)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#1A1D29">범례</text>
    <line x1="0" y1="20" x2="40" y2="20" stroke="#1E2761" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="50" y="24" font-size="12" fill="#1A1D29">조건 충족 (앞으로)</text>
    <line x1="200" y1="20" x2="240" y2="20" stroke="#6B7280" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="250" y="24" font-size="12" fill="#6B7280">롤백 (뒤로)</text>
    <line x1="370" y1="20" x2="410" y2="20" stroke="#E63946" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="420" y="24" font-size="12" fill="#E63946">인터럽트 (피격/사망)</text>
  </g>
</svg>
